<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドローンの気持ち～能美市のドローンシミュレーター～</title>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; }
        
        /* Loading Overlay */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; flex-direction: column; color: white;
            transition: opacity 0.5s;
        }
        .hidden { opacity: 0; pointer-events: none; }
        
        .spinner {
            border: 4px solid #4a5568; border-top: 4px solid #48bb78; border-radius: 50%;
            width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* UI Panel */
        #ui-layer {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 16px; width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            transform: translateX(-380px); /* Initially hidden */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.5);
            z-index: 2000;
            overflow: hidden;
            max-width: calc(100vw - 40px); /* Smartphone safety */
        }
        #ui-layer.visible { transform: translateX(0); }

        /* Collapsible Content Animation */
        #ui-content {
            max-height: 500px; /* Approximate max height */
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            opacity: 1;
        }
        #ui-layer.collapsed #ui-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        
        /* Toggle Button Rotation */
        #ui-toggle-icon {
            transition: transform 0.3s;
        }
        #ui-layer.collapsed #ui-toggle-icon {
            transform: rotate(180deg);
        }

        /* Route List Styling */
        #route-list {
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
            width: 100%;
        }
        #route-list::-webkit-scrollbar { width: 6px; }
        #route-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); }
        #route-list::-webkit-scrollbar-thumb { background: #48bb78; border-radius: 3px; }

        .route-card {
            background: rgba(255, 255, 255, 0.1); 
            padding: 12px 15px; border-radius: 10px; margin-bottom: 8px;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.1); 
            transition: all 0.2s ease;
            position: relative; overflow: hidden;
            display: flex; justify-content: space-between; align-items: center;
        }
        .route-card:hover { 
            background: rgba(255, 255, 255, 0.2); 
            transform: translateX(5px);
            border-color: #48bb78;
        }
        .route-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: currentColor; opacity: 0.8;
        }

        h1.title-font {
            font-feature-settings: "palt";
            letter-spacing: 0.05em;
        }
    </style>
</head>

<!-- Start / Loading Screen -->
<div id="loading-overlay">
    <div id="loading-spinner" class="spinner"></div>
    <h2 id="loading-text" class="text-2xl font-bold mb-2 tracking-widest">MAP LOADING...</h2>
    <p class="text-sm text-gray-400 mb-8">能美市広域地図データを生成中</p>

    <!-- Route Selection (Hidden initially) -->
    <div id="route-selection" class="hidden w-full max-w-3xl px-4 flex flex-col items-center">

            ドローンの気持ち<br>
            <span class="text-lg font-normal text-gray-300">～能美市のドローンシミュレーター～</span>
        </h1>
        
        <div class="w-full max-w-xl bg-gray-800 bg-opacity-70 p-4 rounded-xl border border-gray-700 backdrop-blur-sm">
            <h3 class="text-gray-300 text-sm mb-3 border-b border-gray-600 pb-2">飛行ルートを選択してください</h3>
            <div id="route-list">
                <!-- Routes will be injected here -->
            </div>
        </div>
    </div>
</div>

<div id="canvas-container"></div>

<!-- HUD (Collapsible) -->

        </div>
        <div class="p-2 rounded-full hover:bg-gray-200 transition">

        </div>
    </div>

            </button>
            <button id="btn-reset" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition w-1/3 text-sm">

        </div>

        </button>

        <div class="grid grid-cols-2 gap-y-2 text-sm text-gray-600 border-t border-gray-200 pt-4">
            <div class="flex items-center gap-1">
                <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
                高度 (ALT)
            </div>
            <div class="text-right font-mono font-bold text-xl text-gray-800"><span id="val-alt">0</span><span class="text-xs ml-1 text-gray-500">m</span></div>
            
            <div class="flex items-center gap-1">
                <div class="w-2 h-2 bg-green-500 rounded-full"></div>

            </div>
            <div class="text-right font-mono text-xl text-gray-800"><span id="val-speed">0</span><span class="text-xs ml-1 text-gray-500">km/h</span></div>

            <div id="progress-bar" class="bg-green-500 h-full rounded-full transition-all duration-100" style="width: 0%"></div>
        </div>
    </div>
</div>

        const dLat = (lat - ORIGIN.lat) * Math.PI / 180;
        const dLng = (lng - ORIGIN.lng) * Math.PI / 180;
        const x = dLng * R * Math.cos(ORIGIN.lat * Math.PI / 180);
        const z = dLat * R * -1;
        return { x, z };
    }

        { name: "辰口福祉会館⇔仏大寺公民館", data: parseKMLString(data_BUTSUDAIJI), color: "text-lime-400" },
        { name: "辰口福祉会館⇔宮竹小学校", data: parseKMLString(data_MIYATAKE), color: "text-blue-400" },
        { name: "辰口福祉会館⇔石川ハイテク交流センター", data: parseKMLString(data_ISHIKAWA), color: "text-purple-400" },
        { name: "辰口福祉会館⇔大口公民館", data: parseKMLString(data_OGUCHI), color: "text-yellow-400" },
        { name: "辰口福祉会館⇔道の駅しらやまさん", data: parseKMLString(data_SHIRAYAMA), color: "text-red-400" },
        { name: "辰口福祉会館⇔坪野公民館", data: parseKMLString(data_TSUBONO), color: "text-pink-400" },
        { name: "辰口福祉会館⇔灯台笹公民館", data: parseKMLString(data_TODASASARA), color: "text-indigo-400" },
        { name: "辰口福祉会館⇔和気小学校", data: parseKMLString(data_WAKE), color: "text-teal-400" },
        { name: "辰口福祉会館⇔和佐谷公民館", data: parseKMLString(data_WASADANI), color: "text-orange-400" },
        { name: "辰口福祉会館⇔和光台公民館", data: parseKMLString(data_WAKODAI), color: "text-cyan-400" }
    ];

    let activeRoute = null;
    let flightPathCurve = null;

    // --- 3. UI Generation ---
    const routeListEl = document.getElementById('route-list');
    ROUTES.forEach((r, idx) => {
        const div = document.createElement('div');
        div.className = 'route-card';
        div.onclick = () => selectRoute(idx);
        div.innerHTML = `
            <div>
                <div class="text-white font-bold text-sm md:text-base">${r.name}</div>
            </div>
            <div class="${r.color} text-xl">✈</div>
        `;
        routeListEl.appendChild(div);
    });

    // UI Toggle Function
    window.toggleUI = function() {
        const layer = document.getElementById('ui-layer');
        layer.classList.toggle('collapsed');
    };

    // --- 4. Three.js Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); 
    scene.fog = new THREE.Fog(0x87CEEB, 200, 6000); 

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50000);
    camera.position.set(0, 300, 300);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(500, 1000, 500);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    const d = 4000; 
    dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(30000, 30000, 64, 64);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a403a, roughness: 1 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- 5. Drone Model ---
    const droneGroup = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, 0.8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    body.castShadow = true;
    droneGroup.add(body);
    
    const armGeo = new THREE.CylinderGeometry(0.08, 0.08, 3.5);
    const armMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const propGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.02, 32);
    const propMat = new THREE.MeshStandardMaterial({ color: 0x111111, transparent: true, opacity: 0.8 });
    
    [45, -45].forEach(deg => {
        const arm = new THREE.Mesh(armGeo, armMat);
        arm.rotation.z = Math.PI/2;
        arm.rotation.y = deg * Math.PI/180;
        droneGroup.add(arm);
    });
    const props = [];
    [[-1.2, 1.2], [1.2, -1.2], [-1.2, -1.2], [1.2, 1.2]].forEach(([x,z]) => {
        const p = new THREE.Mesh(propGeo, propMat);
        p.position.set(x, 0.25, z);
        droneGroup.add(p);
        props.push(p);
    });
    scene.add(droneGroup);
    droneGroup.visible = false; 

    // --- 6. Environment Loader ---
    const roadMaterial = new THREE.LineBasicMaterial({ color: 0x555555 });
    const majorRoadMaterial = new THREE.LineBasicMaterial({ color: 0x888888 });
    
    async function loadEnvironment() {
        const bbox = `36.40,136.53,36.47,136.64`;
        
        const query = `
            [out:json][timeout:25];
            (
              way["building"](${bbox});
              way["highway"](${bbox});
            );
            (._;>;);
            out;
        `;
        
        try {
            const response = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
            const data = await response.json();
            
            generateWorld(data);
            
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('loading-text').style.display = 'none';
            document.querySelector('#loading-overlay p').style.display = 'none';
            document.getElementById('route-selection').classList.remove('hidden');

        } catch (e) {
            console.error(e);
            document.getElementById('loading-text').innerText = "データ取得エラー";
        }
    }

    function generateWorld(osmData) {
        const nodes = {};
        osmData.elements.forEach(el => {
            if (el.type === 'node') nodes[el.id] = { lat: el.lat, lng: el.lon };
        });

        const buildings = new THREE.Group();
        const roads = new THREE.Group();
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xe5e7eb });

        osmData.elements.forEach(el => {
            if (el.type === 'way' && el.nodes) {
                const points = [];
                el.nodes.forEach(id => {
                    const n = nodes[id];
                    if(n) {
                        const p = project(n.lat, n.lng);
                        points.push(p);
                    }
                });
                
                if(points.length < 2) return;

                if (el.tags.building) {
                    const shapePts = points.map(p => new THREE.Vector2(p.x, -p.z));
                    const shape = new THREE.Shape(shapePts);
                    const levels = el.tags['building:levels'] ? parseInt(el.tags['building:levels']) : Math.random() < 0.8 ? 1 : 3;
                    const height = levels * 4 + 2;
                    
                    const geo = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
                    geo.rotateX(-Math.PI / 2);
                    const mesh = new THREE.Mesh(geo, wallMat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    buildings.add(mesh);
                } 
                else if (el.tags.highway) {
                    const vec3s = points.map(p => new THREE.Vector3(p.x, 0.5, p.z));
                    const geo = new THREE.BufferGeometry().setFromPoints(vec3s);
                    const isMajor = ['primary', 'secondary', 'tertiary', 'motorway'].some(t => el.tags.highway.includes(t));
                    const line = new THREE.Line(geo, isMajor ? majorRoadMaterial : roadMaterial);
                    roads.add(line);
                }
            }
        });

        scene.add(buildings);
        scene.add(roads);
    }
    
    loadEnvironment();


    // --- 7. Animation Logic ---
    let pathMesh = null;
    let progress = 0;
    let isPlaying = false;
    let isFinished = false;
    let cameraMode = 'follow';

    window.selectRoute = function(index) {
        activeRoute = ROUTES[index];
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('ui-layer').classList.add('visible');
        document.getElementById('route-name-display').innerText = activeRoute.name;

        if(pathMesh) scene.remove(pathMesh);
        
        const vectors = activeRoute.data.map(p => {
            const pos = project(p.lat, p.lng);
            return new THREE.Vector3(pos.x, p.alt - BASE_ALTITUDE, pos.z);
        });
        
        flightPathCurve = new THREE.CatmullRomCurve3(vectors);
        
        const tubeGeo = new THREE.TubeGeometry(flightPathCurve, vectors.length * 10, 0.4, 6, false);
        pathMesh = new THREE.Mesh(tubeGeo, new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent:true, opacity:0.8 }));
        scene.add(pathMesh);

        droneGroup.visible = true;
        const startPos = flightPathCurve.getPointAt(0);
        droneGroup.position.copy(startPos);
        droneGroup.lookAt(flightPathCurve.getPointAt(0.01));

        progress = 0;
        isFinished = false;
        isPlaying = false;
        document.getElementById('btn-play').innerText = "再生 / 停止";
        
        controls.target.copy(startPos);
        camera.position.set(startPos.x + 20, startPos.y + 20, startPos.z + 20);
        controls.update();
    };

    function animate() {
        requestAnimationFrame(animate);

        if (isPlaying && flightPathCurve) {
            const speed = 0.0002; 
            progress += speed;

            if (progress >= 1) {
                progress = 1;
                isPlaying = false;
                isFinished = true;
                document.getElementById('btn-play').innerHTML = '<span>リプレイ</span>';
            }

            const pos = flightPathCurve.getPointAt(progress);
            const nextPos = flightPathCurve.getPointAt(Math.min(progress + 0.01, 1));
            
            droneGroup.position.copy(pos);
            droneGroup.lookAt(nextPos);
            props.forEach(p => p.rotation.y += 0.8);

            document.getElementById('val-alt').innerText = Math.round(pos.y + BASE_ALTITUDE);
            document.getElementById('val-speed').innerText = isPlaying ? "42" : "0";
            document.getElementById('progress-bar').style.width = (progress * 100) + '%';
        }

        if (isPlaying && cameraMode === 'follow' && flightPathCurve) {
            const pos = droneGroup.position;
            const tangent = flightPathCurve.getTangentAt(progress).normalize();
            const camOffset = tangent.clone().negate().multiplyScalar(15).add(new THREE.Vector3(0, 8, 0));
            camera.position.lerp(pos.clone().add(camOffset), 0.1);
            camera.lookAt(pos);
        } else {
            controls.update();
        }

        renderer.render(scene, camera);
    }
    animate();

    const btnPlay = document.getElementById('btn-play');
    btnPlay.addEventListener('click', () => {
        if(!activeRoute) return;
        if(isFinished) {
            progress = 0;
            isFinished = false;
            document.getElementById('btn-play').innerHTML = '<span>再生 / 停止</span>';
        }
        isPlaying = !isPlaying;
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
        isPlaying = false;
        document.getElementById('loading-overlay').classList.remove('hidden');
        document.getElementById('ui-layer').classList.remove('visible');
    });

    document.getElementById('btn-camera').addEventListener('click', () => {
        cameraMode = cameraMode === 'follow' ? 'free' : 'follow';
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

</script>
</body>
</html>
