<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd84c" />
  <title>rule24 — radiant drift</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff2b8;
    }
    body {
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
    }
    .veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.22), rgba(255,255,255,0) 28%),
        radial-gradient(circle at 82% 78%, rgba(255,255,255,.08), rgba(255,255,255,0) 24%),
        linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,0) 42%, rgba(0,0,0,.03));
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <canvas id="art" aria-label="rule24 animated abstract artwork"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('art');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const TAU = Math.PI * 2;

      const P = {
        warm0: '#fff7db',
        warm1: '#ffe65b',
        warm2: '#ffc928',
        warm3: '#ff9f2f',
        warm4: '#ff6d2d',
        warm5: '#ff4d25',
        cool0: '#c8f0ff',
        cool1: '#97dfff',
        cool2: '#7dcfff',
        cool3: '#4cb8ff',
        deep0: '#2e5e76',
        deep1: '#17364e',
        green: '#59d742',
        white: '#ffffff'
      };

      let W = 0, H = 0, DPR = 1;
      let time = 0;
      let last = performance.now();
      let resizeTimer = 0;
      let seed = Math.floor(Math.random() * 1e9);

      let warmParticles = [];
      let coolParticles = [];
      let shimmer = [];
      let dust = [];
      let streamers = [];
      let haloBursts = [];
      let baseTexA = null;
      let baseTexB = null;

      function mulberry32(a) {
        return function() {
          let t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      const rr = (rng, min, max) => min + (max - min) * rng();
      const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
      const wrap = (v, max) => ((v % max) + max) % max;
      const lerp = (a, b, t) => a + (b - a) * t;

      function makeTexture(size, mode) {
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const g = c.getContext('2d');
        const rng = mulberry32(seed + mode * 1000 + size);

        const bg = g.createLinearGradient(0, 0, size, size);
        bg.addColorStop(0, mode === 0 ? '#fff5cf' : '#ffeaa8');
        bg.addColorStop(0.32, mode === 0 ? '#ffdc64' : '#ffb544');
        bg.addColorStop(0.62, mode === 0 ? '#ff8b2f' : '#ffd15d');
        bg.addColorStop(1, mode === 0 ? '#fff7db' : '#8fd8ff');
        g.fillStyle = bg;
        g.fillRect(0, 0, size, size);

        const dotCount = mode === 0 ? Math.round(size * size * 0.045) : Math.round(size * size * 0.035);
        for (let i = 0; i < dotCount; i++) {
          const x = rr(rng, 0, size);
          const y = rr(rng, 0, size);
          const diag = (x / size + y / size) * 0.5;
          const warmWeight = mode === 0 ? 1 - Math.max(0, (diag - 0.55) / 0.45) : 1 - Math.max(0, (diag - 0.25) / 0.75);
          const palette = warmWeight > 0.55
            ? [P.warm0, P.warm1, P.warm2, P.warm3, P.warm4, P.white]
            : [P.cool0, P.cool1, P.cool2, P.warm1, P.warm3, P.white];
          g.globalAlpha = rr(rng, 0.06, 0.3);
          g.fillStyle = pick(rng, palette);
          g.beginPath();
          g.arc(x, y, rr(rng, 0.4, mode === 0 ? 3.6 : 2.8), 0, TAU);
          g.fill();
        }

        for (let i = 0; i < 140; i++) {
          const x = rr(rng, 0, size);
          const y = rr(rng, 0, size);
          const grad = g.createRadialGradient(x, y, 0, x, y, rr(rng, size * 0.04, size * 0.14));
          grad.addColorStop(0, pick(rng, [P.white, P.warm2, P.warm3, P.cool1]));
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          g.globalAlpha = rr(rng, 0.02, 0.09);
          g.fillStyle = grad;
          g.beginPath();
          g.arc(x, y, rr(rng, size * 0.04, size * 0.14), 0, TAU);
          g.fill();
        }

        g.globalAlpha = 1;
        return c;
      }

      function diagonalFieldValue(x, y) {
        const nx = x / W;
        const ny = y / H;
        return 0.68 * nx + 0.92 * ny;
      }

      function buildScene() {
        const rng = mulberry32(seed);
        warmParticles = [];
        coolParticles = [];
        shimmer = [];
        dust = [];
        streamers = [];
        haloBursts = [];

        const texSize = Math.max(700, Math.min(1400, Math.round(Math.max(W, H) * 0.95)));
        baseTexA = makeTexture(texSize, 0);
        baseTexB = makeTexture(texSize, 1);

        const warmCount = Math.max(2400, Math.round((W * H) / 900));
        for (let i = 0; i < warmCount; i++) {
          warmParticles.push({
            x: rr(rng, 0, W),
            y: rr(rng, 0, H),
            r: rr(rng, 0.6, 6.8),
            alpha: rr(rng, 0.08, 0.65),
            color: pick(rng, [P.warm0, P.warm1, P.warm2, P.warm3, P.warm4, P.white]),
            driftX: rr(rng, -4.2, 4.2),
            driftY: rr(rng, -4.2, 4.2),
            orbit: rr(rng, 0, 5),
            speed: rr(rng, 0.1, 0.9),
            phase: rr(rng, 0, TAU)
          });
        }

        const coolCount = Math.max(950, Math.round((W * H) / 2100));
        for (let i = 0; i < coolCount; i++) {
          const t = rr(rng, 0, 1);
          const x = lerp(W * 0.56, W * 1.04, t) + rr(rng, -W * 0.05, W * 0.05);
          const y = lerp(H * 0.46, H * 1.04, t) + rr(rng, -H * 0.08, H * 0.08);
          coolParticles.push({
            x, y,
            r: rr(rng, 1.0, 8.0),
            alpha: rr(rng, 0.12, 0.72),
            color: pick(rng, [P.cool0, P.cool1, P.cool2, P.cool3, P.white, P.warm1]),
            driftX: rr(rng, -3.5, 2.5),
            driftY: rr(rng, -3.0, 3.4),
            orbit: rr(rng, 0, 7),
            speed: rr(rng, 0.15, 1.1),
            phase: rr(rng, 0, TAU)
          });
        }

        const shimmerCount = Math.max(500, Math.round((W * H) / 4200));
        for (let i = 0; i < shimmerCount; i++) {
          shimmer.push({
            x: rr(rng, 0, W),
            y: rr(rng, 0, H),
            len: rr(rng, 8, 38),
            width: rr(rng, 0.5, 2.2),
            angle: -0.92 + rr(rng, -0.28, 0.28),
            alpha: rr(rng, 0.04, 0.22),
            color: pick(rng, [P.white, P.warm0, P.warm1, P.cool0]),
            driftX: rr(rng, -2.5, 2.5),
            driftY: rr(rng, -2.5, 2.5),
            phase: rr(rng, 0, TAU)
          });
        }

        const dustCount = Math.max(2600, Math.round((W * H) / 1200));
        for (let i = 0; i < dustCount; i++) {
          dust.push({
            x: rr(rng, 0, W),
            y: rr(rng, 0, H),
            r: rr(rng, 0.25, 1.4),
            color: pick(rng, [P.white, P.warm1, P.warm3, P.cool1, P.green]),
            alpha: rr(rng, 0.06, 0.45),
            driftX: rr(rng, -2.5, 2.5),
            driftY: rr(rng, -2.5, 2.5),
            phase: rr(rng, 0, TAU)
          });
        }

        const streamerCount = 18;
        for (let i = 0; i < streamerCount; i++) {
          streamers.push({
            x: rr(rng, -W * 0.1, W * 0.7),
            y: rr(rng, -H * 0.1, H * 0.6),
            len: rr(rng, Math.max(W, H) * 0.25, Math.max(W, H) * 0.75),
            thickness: rr(rng, 20, 70),
            alpha: rr(rng, 0.025, 0.085),
            color: pick(rng, [P.warm0, P.warm1, P.warm2, P.warm3, P.cool0]),
            driftX: rr(rng, -3, 3),
            driftY: rr(rng, -3, 3),
            phase: rr(rng, 0, TAU)
          });
        }

        const haloCount = 10;
        for (let i = 0; i < haloCount; i++) {
          haloBursts.push({
            x: rr(rng, 0, W),
            y: rr(rng, 0, H),
            r: rr(rng, Math.min(W, H) * 0.09, Math.min(W, H) * 0.24),
            color: pick(rng, [P.white, P.warm1, P.warm2, P.cool0]),
            alpha: rr(rng, 0.03, 0.1),
            phase: rr(rng, 0, TAU),
            driftX: rr(rng, -1.2, 1.2),
            driftY: rr(rng, -1.2, 1.2)
          });
        }
      }

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 1.75);
        W = Math.max(1, window.innerWidth);
        H = Math.max(1, window.innerHeight);
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.imageSmoothingEnabled = true;
        buildScene();
      }

      function drawBase(t) {
        const bg = ctx.createLinearGradient(0, 0, W, H);
        bg.addColorStop(0, '#fff8db');
        bg.addColorStop(0.18, '#ffe456');
        bg.addColorStop(0.42, '#ffb23e');
        bg.addColorStop(0.64, '#ff8b32');
        bg.addColorStop(0.82, '#bfe7ff');
        bg.addColorStop(1, '#20445d');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        const diag = ctx.createLinearGradient(0, 0, W, H);
        diag.addColorStop(0, 'rgba(255,255,255,0.22)');
        diag.addColorStop(0.18, 'rgba(255,236,135,0.12)');
        diag.addColorStop(0.5, 'rgba(255,106,35,0.09)');
        diag.addColorStop(0.76, 'rgba(126,207,255,0.12)');
        diag.addColorStop(1, 'rgba(9,31,48,0.18)');
        ctx.fillStyle = diag;
        ctx.fillRect(0, 0, W, H);

        const tiles = [baseTexA, baseTexB];
        const moves = [[8.6, -6.1], [-5.2, 4.4]];
        const alphas = [0.48, 0.26];
        const blends = ['screen', 'source-over'];

        for (let k = 0; k < tiles.length; k++) {
          const tex = tiles[k];
          const tw = tex.width;
          const th = tex.height;
          const ox = wrap(t * moves[k][0], tw);
          const oy = wrap(t * moves[k][1], th);
          ctx.save();
          ctx.globalAlpha = alphas[k];
          ctx.globalCompositeOperation = blends[k];
          for (let y = -th + oy; y < H + th; y += th) {
            for (let x = -tw + ox; x < W + tw; x += tw) {
              ctx.drawImage(tex, x, y);
            }
          }
          ctx.restore();
        }

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (const h of haloBursts) {
          const x = h.x + Math.cos(t * 0.08 + h.phase) * h.driftX * 16;
          const y = h.y + Math.sin(t * 0.08 + h.phase) * h.driftY * 16;
          const r = h.r * (1 + Math.sin(t * 0.11 + h.phase) * 0.08);
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, h.color);
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.globalAlpha = h.alpha;
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawStreamers(t) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (const s of streamers) {
          const x = s.x + Math.cos(t * 0.08 + s.phase) * s.driftX * 14;
          const y = s.y + Math.sin(t * 0.1 + s.phase) * s.driftY * 14;
          const x2 = x + s.len * 0.78;
          const y2 = y + s.len * 0.56;
          const grad = ctx.createLinearGradient(x, y, x2, y2);
          grad.addColorStop(0, s.color);
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.strokeStyle = grad;
          ctx.globalAlpha = s.alpha;
          ctx.lineWidth = s.thickness * (1 + Math.sin(t * 0.2 + s.phase) * 0.06);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.bezierCurveTo(
            x + s.len * 0.2, y + s.len * 0.08,
            x + s.len * 0.46, y + s.len * 0.4,
            x2, y2
          );
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawParticles(set, t, mode = 'screen') {
        ctx.save();
        ctx.globalCompositeOperation = mode;
        for (const p of set) {
          const x = wrap(p.x + t * p.driftX + Math.cos(t * p.speed + p.phase) * p.orbit, W + 24) - 12;
          const y = wrap(p.y + t * p.driftY + Math.sin(t * p.speed * 1.13 + p.phase) * p.orbit, H + 24) - 12;
          const d = diagonalFieldValue(x, y);
          const bright = Math.max(0, 1.15 - d);
          const coolBoost = Math.max(0, (d - 0.78) / 0.34);
          const pulse = 1 + Math.sin(t * 0.85 + p.phase) * 0.08;
          ctx.globalAlpha = p.alpha * (0.65 + 0.35 * Math.sin(t * 0.65 + p.phase) ** 2) * (mode === 'screen' ? 1 : 0.9);
          if (coolBoost > 0.4 && (p.color === P.cool0 || p.color === P.cool1 || p.color === P.cool2 || p.color === P.cool3)) {
            ctx.globalAlpha *= 0.9 + coolBoost * 0.4;
          } else {
            ctx.globalAlpha *= 0.76 + bright * 0.36;
          }
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(x, y, p.r * pulse, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawShimmer(t) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.globalCompositeOperation = 'screen';
        for (const s of shimmer) {
          const x = wrap(s.x + t * s.driftX, W + s.len * 2) - s.len;
          const y = wrap(s.y + t * s.driftY, H + s.len * 2) - s.len;
          const ang = s.angle + Math.sin(t * 0.14 + s.phase) * 0.22;
          ctx.strokeStyle = s.color;
          ctx.globalAlpha = s.alpha * (0.6 + 0.4 * Math.sin(t * 0.9 + s.phase) ** 2);
          ctx.lineWidth = s.width;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + Math.cos(ang) * s.len, y + Math.sin(ang) * s.len);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawDust(t) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (const d of dust) {
          const x = wrap(d.x + t * d.driftX + Math.cos(t * 0.35 + d.phase), W + 10) - 5;
          const y = wrap(d.y + t * d.driftY + Math.sin(t * 0.35 + d.phase), H + 10) - 5;
          ctx.globalAlpha = d.alpha;
          ctx.fillStyle = d.color;
          ctx.beginPath();
          ctx.arc(x, y, d.r, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function frame(now) {
        const dt = Math.min(40, now - last) / 1000;
        last = now;
        time += dt;

        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';

        drawBase(time);
        drawStreamers(time);
        drawParticles(warmParticles, time * 1.0, 'screen');
        drawParticles(coolParticles, time * 1.05, 'screen');
        drawDust(time * 1.1);
        drawShimmer(time * 0.95);

        requestAnimationFrame(frame);
      }

      function reseed() {
        seed = Math.floor(Math.random() * 1e9);
        buildScene();
      }

      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 120);
      }, { passive: true });

      let lastTap = 0;
      window.addEventListener('pointerdown', () => {
        const now = performance.now();
        if (now - lastTap < 320) reseed();
        lastTap = now;
      }, { passive: true });

      document.addEventListener('visibilitychange', () => {
        last = performance.now();
      });

      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
