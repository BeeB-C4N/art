<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>RULE 2 — AR</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --black: #000;
      --white: #fff;
      --muted: rgba(255, 255, 255, .62);
      --line: rgba(255, 255, 255, .22);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100dvh;
      overscroll-behavior: none;
    }

    .title-area {
      position: fixed;
      top: max(24px, env(safe-area-inset-top));
      left: 0;
      z-index: 20;
      width: 100%;
      padding: 0 24px;
      text-align: center;
      pointer-events: none;
    }

    .series {
      margin: 0;
      font-size: clamp(34px, 9vw, 64px);
      font-weight: 800;
      line-height: .9;
      letter-spacing: .12em;
      text-indent: .12em;
    }

    .work-number {
      margin-top: 9px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .34em;
      text-indent: .34em;
      color: var(--muted);
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 100dvh;
      background: #000;
      --poster-color: #000;
      --progress-bar-color: #fff;
      --progress-bar-height: 2px;
    }

    .footer {
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 30;
      width: 100%;
      padding: 18px 18px max(18px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      background: linear-gradient(to top, rgba(0,0,0,.96), rgba(0,0,0,.72) 68%, rgba(0,0,0,0));
    }

    .ar-button {
      appearance: none;
      min-width: min(78vw, 340px);
      min-height: 52px;
      padding: 0 26px;
      border: 1px solid var(--white);
      border-radius: 999px;
      background: var(--white);
      color: var(--black);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .ar-button:active {
      transform: scale(.97);
      opacity: .84;
    }

    #ar-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, .72);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    #ar-modal .box {
      width: min(86vw, 330px);
      padding: 26px 24px 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #050505;
      color: var(--white);
      text-align: center;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .48);
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 3px solid rgba(255,255,255,.22);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #ar-message {
      min-height: 3em;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1.7;
      letter-spacing: .04em;
    }

    #ar-close {
      display: inline-block;
      margin-top: 15px;
      color: var(--muted);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
    }

    .fallback {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: #000;
      color: #fff;
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <header class="title-area" aria-label="作品タイトル">
    <h1 class="series">RULE</h1>
    <div class="work-number">02</div>
  </header>

  <model-viewer
    id="viewer"
    src="./rule2.glb"
    ios-src="./rule2.usdz"
    alt="Rule 2 animated sphere"
    ar
    ar-modes="quick-look scene-viewer webxr"
    ar-placement="floor"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="10deg"
    autoplay
    animation-crossfade-duration="0"
    interaction-prompt="none"
    shadow-intensity="0"
    exposure="1.1"
    environment-image="neutral"
    camera-orbit="0deg 75deg 2.8m"
    min-camera-orbit="auto auto 1.8m"
    max-camera-orbit="auto auto 5m">
  </model-viewer>

  <div class="footer">
    <button class="ar-button" type="button" onclick="openAR()">
      RULE 2を現実空間に置く
    </button>
  </div>

  <div id="ar-modal" role="dialog" aria-modal="true" aria-label="AR起動中">
    <div class="box">
      <div class="spinner" aria-hidden="true"></div>
      <div id="ar-message"></div>
      <span id="ar-close">閉じる</span>
    </div>
  </div>

  <div id="fallback" class="fallback">
    3Dモデルを読み込めませんでした。<br />
    HTML、GLB、USDZを同じフォルダに配置してください。
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const modal = document.getElementById('ar-modal');
    const closeButton = document.getElementById('ar-close');
    const message = document.getElementById('ar-message');
    const fallback = document.getElementById('fallback');

    const messages = [
      'ARを起動しています',
      'RULE 2を読み込んでいます',
      '床や机をゆっくり映してください',
      'AR体験中は周囲にご注意ください'
    ];

    let messageIndex = 0;
    let messageTimer = null;

    function cycleMessages() {
      message.textContent = messages[messageIndex];
      messageIndex = (messageIndex + 1) % messages.length;
      messageTimer = window.setTimeout(cycleMessages, 4200);
    }

    function showARModal() {
      modal.style.display = 'flex';
      messageIndex = 0;
      window.clearTimeout(messageTimer);
      cycleMessages();
    }

    function hideARModal() {
      modal.style.display = 'none';
      window.clearTimeout(messageTimer);
    }

    async function openAR() {
      showARModal();
      try {
        await viewer.activateAR();
      } catch (error) {
        console.warn('AR起動に失敗しました:', error);
        hideARModal();
      }
    }

    viewer.addEventListener('ar-status', (event) => {
      const status = event.detail?.status;
      if (status === 'session-started' || status === 'failed' || status === 'not-presenting') {
        hideARModal();
      }
    });

    viewer.addEventListener('quick-look-button-tapped', hideARModal);

    viewer.addEventListener('error', (event) => {
      console.warn('モデルの読み込みに失敗しました:', event);
      fallback.style.display = 'flex';
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') hideARModal();
    });

    closeButton.addEventListener('click', hideARModal);
    window.openAR = openAR;
  </script>
</body>
</html>
