    <style>

        /* Map Customization */

            width: 100%;
            height: 100%;
            background: #f1f5f9; /* Light background for the map loading state */
            font-family: 'Noto Sans JP', sans-serif;
        }
        /* Popup Styling - Light Theme compatible */
        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.98);
            color: #1e293b;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 0;
            overflow: hidden;
        }
        .custom-popup .leaflet-popup-content {
            margin: 0;
            width: 260px !important;
        }
        .custom-popup .leaflet-popup-tip {

        }

            right: 8px;

        .marker-pin {

            transition: transform 0.2s;
        }
        .marker-pin:hover {
            transform: scale(1.1) translateY(-4px);
        }
        
        /* Animation */
        @keyframes stamp-in {
            0% { transform: scale(3); opacity: 0; rotate: -45deg; }
            100% { transform: scale(1); opacity: 1; rotate: 0deg; }
        }

            animation: stamp-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body>

        // ---------------------------------------------------------
        // DATA DEFINITION
        // ---------------------------------------------------------
        const SPOTS = [
            { id: 1, name: "湖東", lat: 36.346034, lng: 136.394105, address: "加賀市干拓町238" },
            { id: 2, name: "さえぐさの丘", lat: 36.31123, lng: 136.38706, address: "加賀市清水町70" },
            { id: 3, name: "荒俣峡", lat: 36.305654, lng: 136.486382, address: "小松市赤瀬町甲之部67-1" },

            { id: 5, name: "和気の岩", lat: 36.428615, lng: 136.533244, address: "能美市和気町オ之部14-5" },
            { id: 6, name: "川北大橋", lat: 36.465262, lng: 136.577236, address: "能美郡川北町三反田東146" },
            { id: 7, name: "黄門橋", lat: 36.361708, lng: 136.61474, address: "白山市吉野夏之部108-2" },

            { id: 20, name: "ゾウゾウ鼻", lat: 37.398839, lng: 136.843858, address: "輪島市鵜入町子の部2の1番地" },
            { id: 21, name: "上大沢", lat: 37.368755, lng: 136.783412, address: "輪島市上大沢四字甲" },
            { id: 22, name: "名舟", lat: 37.432443, lng: 137.020786, address: "輪島市名舟町ト部142" },

            { id: 25, name: "春蘭の里", lat: 37.303459, lng: 137.006405, address: "鳳珠郡能登町字鮭尾六字54番1" },
            { id: 26, name: "千畳敷", lat: 37.298664, lng: 137.194324, address: "鳳珠郡能登町小浦地内" },
            { id: 27, name: "木ノ浦", lat: 37.529044, lng: 137.2717804, address: "珠洲市折戸町ロ16-1" },
            { id: 28, name: "寺家", lat: 37.494305, lng: 137.343385, address: "珠洲市三崎町寺家154番の4" },
            { id: 29, name: "大谷", lat: 37.49883, lng: 137.184082, address: "珠洲市馬緤町へ字1-11" },
            { id: 30, name: "雲津", lat: 37.443036, lng: 137.347115, address: "珠洲市三崎町雲津子部66番1" },
            { id: 31, name: "垂水の滝", lat: 37.466271, lng: 137.086383, address: "珠洲市真浦町カ部13番地" },
            { id: 32, name: "若山の庄", lat: 37.460687, lng: 137.221723, address: "珠洲市若山町延武い部40-1" }
        ];

        // ---------------------------------------------------------
        // UTILS
        // ---------------------------------------------------------
        
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const d = R * c; 
            return d;
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }

        // SVG Pin Icon Generator
        const getPinSvg = (color) => `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${color}" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3" fill="white"></circle>
            </svg>
        `;

        // ---------------------------------------------------------
        // COMPONENTS
        // ---------------------------------------------------------

        const Icons = {
            Map: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>,
            Book: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>,
            Bike: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>,
            Navigation: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>,
            ExternalLink: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        };

        const AlertModal = ({ message, type, onClose }) => {
            if (!message) return null;
            const bgClass = type === 'success' ? 'bg-green-600' : 'bg-red-600';
            
            return (
                <div className="fixed inset-0 flex items-center justify-center z-[2000] p-4 bg-black bg-opacity-70 animate-fade-in">
                    <div className="bg-slate-800 border border-slate-600 p-6 rounded-lg shadow-2xl max-w-sm w-full text-center relative overflow-hidden">
                         <div className={`absolute top-0 left-0 w-full h-1 ${bgClass}`}></div>
                        <h3 className="text-xl font-bold font-display mb-2 text-white">{type === 'success' ? 'MISSION COMPLETE' : 'NOTICE'}</h3>
                        <p className="mb-6 text-gray-300">{message}</p>
                        <button 
                            onClick={onClose}
                            className={`w-full py-3 rounded-md font-bold text-white transition-colors ${type === 'success' ? 'bg-green-600 hover:bg-green-700' : 'bg-slate-600 hover:bg-slate-700'}`}
                        >
                            CLOSE
                        </button>
                    </div>
                </div>
            );
        };

        const TopScreen = ({ onStart }) => {
            return (
                <div className="h-screen w-full bg-gradient-nature flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-30"></div>
                    
                    <div className="z-10 animate-fade-in-up flex flex-col items-center">
                        <div className="mb-4 inline-block p-4 rounded-full bg-white bg-opacity-20 backdrop-blur-sm border border-white border-opacity-30">
                            <Icons.Bike />
                        </div>
                        <h1 className="text-4xl md:text-6xl font-black font-display tracking-tighter mb-2 italic text-white">
                            ISHIKAWA<br/>YORIMICHI
                        </h1>
                        <p className="text-lg md:text-xl font-bold text-green-200 tracking-widest mb-12">
                            PARKING RALLY
                        </p>
                        
                        <button 
                            onClick={onStart}
                            className="group relative inline-flex items-center justify-center px-8 py-4 text-lg font-bold text-white transition-all duration-200 bg-slate-900 font-display rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 hover:bg-slate-800 hover:scale-105 shadow-xl border border-slate-700"
                        >
                            <span>RIDE ON</span>
                            <span className="ml-2 group-hover:translate-x-1 transition-transform">→</span>
                        </button>
                    </div>
                    
                    {/* Footer Info */}
                    <div className="absolute bottom-6 z-10 flex flex-col items-center gap-2">
                        <a href="https://www.pref.ishikawa.jp/douken/fukeikaido/" target="_blank" rel="noopener noreferrer" className="text-sm text-green-300 hover:text-green-100 underline flex items-center mb-1">
                            寄り道パーキングとは？ <Icons.ExternalLink className="w-3 h-3 ml-1" />
                        </a>
                        <div className="text-xs text-white text-opacity-50">
                            運営：Code for Noto
                        </div>
                    </div>
                </div>
            );
        };

        const MapView = ({ collectedStamps, onGetStamp }) => {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);

            useEffect(() => {
                if (!mapRef.current) return;
                
                // Initialize map if not already done
                if (!mapInstanceRef.current) {
                    const map = L.map(mapRef.current, {
                        zoomControl: false // Move zoom control if needed or custom
                    }).setView([36.9, 136.7], 9);
                    
                    // Use CartoDB Positron for a brighter, clean map
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                        subdomains: 'abcd',
                        maxZoom: 20
                    }).addTo(map);

                    L.control.zoom({
                        position: 'bottomright'
                    }).addTo(map);
                    
                    mapInstanceRef.current = map;
                }
                
                const map = mapInstanceRef.current;

                // Clear existing markers
                map.eachLayer((layer) => {
                    if (layer instanceof L.Marker) {
                        map.removeLayer(layer);
                    }
                });

                // Add markers
                SPOTS.forEach(spot => {
                    const isCollected = collectedStamps.includes(spot.id);
                    const markerColor = isCollected ? '#2E8B57' : '#2563eb'; // Green or Blue
                    
                    // Custom SVG Pin Icon
                    const customIcon = L.divIcon({
                        className: 'marker-pin',
                        html: getPinSvg(markerColor),
                        iconSize: [40, 40],
                        iconAnchor: [20, 40], // Point of the pin
                        popupAnchor: [0, -35]
                    });

                    const marker = L.marker([spot.lat, spot.lng], { icon: customIcon }).addTo(map);
                    
                    // Build Popup DOM
                    const popupContainer = document.createElement('div');
                    
                    // 1. Header with Image Placeholder or Gradient
                    const header = document.createElement('div');
                    header.className = 'h-16 bg-gradient-to-r from-blue-500 to-teal-500 relative';
                    
                    // 2. Content Body
                    const body = document.createElement('div');
                    body.className = 'p-4 bg-white';
                    
                    // Title
                    const title = document.createElement('h3');
                    title.className = 'font-bold text-lg leading-tight mb-1 text-slate-800 font-display';
                    title.innerText = spot.name;
                    
                    // Address
                    const addr = document.createElement('p');
                    addr.className = 'text-xs text-slate-500 mb-4 flex items-center';
                    addr.innerHTML = `<span class="mr-1">📍</span>${spot.address}`;

                    body.appendChild(title);
                    body.appendChild(addr);

                    // Actions Container
                    const actions = document.createElement('div');
                    actions.className = 'space-y-2';

                    // "Go Here" Button (Google Maps)
                    const navBtn = document.createElement('a');
                    navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;
                    navBtn.target = "_blank";
                    navBtn.className = 'flex items-center justify-center w-full py-2 px-3 border border-slate-200 rounded text-sm font-bold text-slate-600 hover:bg-slate-50 transition no-underline';
                    navBtn.innerHTML = `
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
                        ここへ行く
                    `;

                    // "Get Stamp" Button
                    if (isCollected) {
                        const badge = document.createElement('div');
                        badge.className = 'w-full py-2 bg-green-100 text-green-700 text-sm font-bold text-center rounded border border-green-200';
                        badge.innerText = 'スタンプ取得済み';
                        actions.appendChild(badge);
                    } else {
                        const stampBtn = document.createElement('button');
                        stampBtn.className = 'w-full py-2.5 bg-slate-900 text-white text-sm font-bold rounded shadow-lg hover:bg-slate-800 transition flex items-center justify-center';
                        stampBtn.innerHTML = 'スタンプを押す';
                        stampBtn.onclick = () => onGetStamp(spot);
                        actions.appendChild(stampBtn);
                    }

                    actions.appendChild(navBtn);
                    body.appendChild(actions);

                    popupContainer.appendChild(header);
                    popupContainer.appendChild(body);

                    marker.bindPopup(popupContainer, {
                        className: 'custom-popup',
                        maxWidth: 280,
                        minWidth: 260
                    });
                });

                setTimeout(() => map.invalidateSize(), 100);

            }, [collectedStamps]);

            return <div ref={mapRef} className="w-full h-full z-0" />;
        };

        const StampBook = ({ collectedStamps }) => {
            const progress = Math.round((collectedStamps.length / SPOTS.length) * 100);

            return (
                <div className="h-full overflow-y-auto pb-24 bg-slate-900 text-white">
                    {/* Header Stats */}
                    <div className="sticky top-0 z-10 bg-slate-900/90 backdrop-blur border-b border-slate-700 p-4 shadow-lg">
                        <div className="flex justify-between items-end mb-2">
                            <h2 className="text-xl font-bold font-display italic">MY LOG</h2>
                            <span className="text-2xl font-black text-green-400 font-display">{progress}%</span>
                        </div>
                        <div className="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                            <div 
                                className="bg-gradient-nature h-full transition-all duration-1000 ease-out"
                                style={{ width: `${progress}%` }}
                            ></div>
                        </div>
                        <div className="text-right text-xs text-gray-400 mt-1">
                            {collectedStamps.length} / {SPOTS.length} SPOTS
                        </div>
                    </div>

                    {/* Grid */}
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 p-4">
                        {SPOTS.map((spot) => {
                            const isCollected = collectedStamps.includes(spot.id);
                            
                            return (
                                <div 
                                    key={spot.id} 
                                    className={`relative aspect-square rounded-xl border-2 transition-all duration-300 overflow-hidden group
                                        ${isCollected 
                                            ? 'border-green-500 bg-slate-800 shadow-[0_0_15px_rgba(46,139,87,0.3)]' 
                                            : 'border-slate-700 bg-slate-800/50 opacity-60'
                                        }`}
                                >
                                    <div className="absolute top-2 left-2 text-xs font-mono text-gray-500">#{String(spot.id).padStart(2, '0')}</div>
                                    
                                    <div className="absolute inset-0 flex flex-col items-center justify-center p-2 text-center">
                                        {isCollected ? (
                                            <>
                                                <div className="animate-stamp text-green-500 mb-2">
                                                    <div className="border-4 border-green-500 rounded-full p-2 w-16 h-16 flex items-center justify-center">
                                                        <span className="font-display font-black text-xs rotate-[-15deg] block">DONE</span>
                                                    </div>
                                                </div>
                                                <h3 className="text-white font-bold text-sm line-clamp-2">{spot.name}</h3>
                                            </>
                                        ) : (
                                            <>
                                                <div className="text-slate-600 mb-2">
                                                    <div className="border-2 border-dashed border-slate-600 rounded-full w-12 h-12"></div>
                                                </div>
                                                <h3 className="text-gray-500 font-bold text-sm">{spot.name}</h3>
                                            </>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    
                    {/* Stamp Book Footer Info */}
                    <div className="p-8 text-center space-y-4">
                        <a 
                            href="https://www.pref.ishikawa.jp/douken/fukeikaido/" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="inline-flex items-center text-green-400 hover:text-green-300 text-sm font-bold border border-green-400/30 px-4 py-2 rounded-full transition-colors bg-slate-800/50"
                        >
                            石川県公式：寄り道パーキングについて <Icons.ExternalLink className="w-4 h-4 ml-2" />
                        </a>
                        
                        <div className="text-xs text-slate-500 mt-4">
                            運営：Code for Noto
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [collectedStamps, setCollectedStamps] = useState([]);
            const [modal, setModal] = useState({ message: '', type: '' });

            useEffect(() => {
                const saved = localStorage.getItem('ishikawa_stamps');
                if (saved) {
                    setCollectedStamps(JSON.parse(saved));
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('ishikawa_stamps', JSON.stringify(collectedStamps));
            }, [collectedStamps]);

            const handleStart = () => {
                setView('book');
            };

            const handleGetStamp = (spot) => {
                if (!navigator.geolocation) {
                    setModal({ message: "お使いのブラウザは位置情報をサポートしていません。", type: 'error' });
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        const dist = getDistanceFromLatLonInKm(latitude, longitude, spot.lat, spot.lng);
                        
                        // 1km threshold
                        if (dist <= 1.0) { 
                            if (!collectedStamps.includes(spot.id)) {
                                setCollectedStamps(prev => [...prev, spot.id]);
                                setModal({ message: `「${spot.name}」のスタンプをゲットしました！`, type: 'success' });
                            } else {
                                setModal({ message: "既にスタンプを取得済みです。", type: 'error' });
                            }
                        } else {
                            setModal({ message: `エリア外です。\n現在地から${spot.name}まで約${dist.toFixed(1)}kmあります。`, type: 'error' });
                        }
                    },
                    (error) => {
                         setModal({ message: "位置情報の取得に失敗しました。GPS設定を確認してください。", type: 'error' });
                    }
                );
            };

            const closeModal = () => setModal({ message: '', type: '' });

            if (view === 'home') {
                return <TopScreen onStart={handleStart} />;
            }

            return (
                <div className="flex flex-col h-screen bg-slate-900 text-slate-900">
                    <div className="flex-1 relative overflow-hidden bg-white">
                        {/* Map and Book Switching */}
                        <div className={`absolute inset-0 transition-opacity duration-300 ${view === 'map' ? 'opacity-100 z-10' : 'opacity-0 z-0 pointer-events-none'}`}>
                            <MapView collectedStamps={collectedStamps} onGetStamp={handleGetStamp} />
                        </div>
                        <div className={`absolute inset-0 transition-opacity duration-300 ${view === 'book' ? 'opacity-100 z-10' : 'opacity-0 z-0 pointer-events-none'}`}>
                            <StampBook collectedStamps={collectedStamps} />
                        </div>
                    </div>

                    {/* Bottom Navigation */}
                    <div className="bg-slate-900 border-t border-slate-700 h-16 flex justify-around items-center z-50 shadow-[0_-5px_10px_rgba(0,0,0,0.3)]">
                        <button 
                            onClick={() => setView('book')}
                            className={`flex flex-col items-center justify-center w-1/2 h-full transition-colors ${view === 'book' ? 'text-green-400' : 'text-gray-500 hover:text-gray-300'}`}
                        >
                            <Icons.Book />
                            <span className="text-[10px] font-bold mt-1 font-display tracking-widest">STAMP BOOK</span>
                        </button>
                        
                        <div className="w-px h-8 bg-slate-700"></div>
                        
                        <button 
                            onClick={() => setView('map')}
                            className={`flex flex-col items-center justify-center w-1/2 h-full transition-colors ${view === 'map' ? 'text-blue-400' : 'text-gray-500 hover:text-gray-300'}`}
                        >
                            <Icons.Navigation />
                            <span className="text-[10px] font-bold mt-1 font-display tracking-widest">MAP</span>
                        </button>
                    </div>

                    <AlertModal message={modal.message} type={modal.type} onClose={closeModal} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
