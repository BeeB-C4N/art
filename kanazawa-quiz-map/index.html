        // --- 2. TSVデータをJavaScriptオブジェクトの配列に変換 ---
        function parseTSV(data) {
            // 文字列内の"Access-Control-Allow-Origin: *"や空行をフィルタリング
            const lines = data.trim().split('\n').filter(line => 
                line.trim() !== "" && !line.startsWith("Access-Control-Allow-Origin:")
            );
            
            if (lines.length < 2) return []; // ヘッダーとデータ行がない場合

            const headers = lines[0].split('\t').map(h => h.trim());
            
            return lines.slice(1).map(line => {
                const values = line.split('\t').map(v => v.trim());
                
                // データが不正な行（列数が合わないなど）をスキップ
                if (values.length !== headers.length) {
                    console.warn("Skipping malformed line:", line);
                    return null;
                }

                const entry = {};
                headers.forEach((header, index) => {
                    entry[header] = values[index];
                });

                // 緯度経度が不正な場合はスキップ
                if (isNaN(parseFloat(entry['緯度'])) || isNaN(parseFloat(entry['経度']))) {
                    console.warn("Skipping entry with invalid lat/lng:", entry);
                    return null;
                }
                
                return entry;
            }).filter(entry => entry !== null); // null (スキップされた) エントリを除外
        }

        const mapData = parseTSV(tsvData);

        // --- 3. マップの初期化 ---
        // 金沢市中心部あたりを初期表示
        const map = L.map('map').setView([36.561, 136.656], 14);

        // OpenStreetMapのタイルレイヤーを追加
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // --- 4. ジャンル別マーカーアイコンの定義 ---
        // (leaflet-color-markersの画像URLを使用)
        const commonIconProps = {
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        };

        // 坂 (赤)
        const redIcon = new L.Icon({
            iconUrl: 'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-2x-red.png',
            ...commonIconProps
        });

        // 字地 (緑)
        const greenIcon = new L.Icon({
            iconUrl: 'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-2x-green.png',
            ...commonIconProps
        });

        // 歴史のまちしるべ標柱 (青)
        const blueIcon = new L.Icon({
            iconUrl: 'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-2x-blue.png',
            ...commonIconProps
        });

        // --- 5. マーカーとポップアップの追加 ---
        mapData.forEach(item => {
            const lat = parseFloat(item['緯度']);
            const lon = parseFloat(item['経度']);
            
            let selectedIcon = blueIcon; // デフォルト (歴史のまちしるべ)
            
            if (item['ジャンル'] === '坂') {
                selectedIcon = redIcon;
            } else if (item['ジャンル'] === '字地') {
                selectedIcon = greenIcon;
            }
            
            // ポップアップの内容を生成
            // スタイリングのためにTailwindクラスを一部使用
            const popupContent = `
                <div class="w-64 max-w-xs" style="word-break: break-word;">
                    <div class="font-bold text-lg mb-1">${item['正解ふりがな']}</div>
                    <div class="text-sm text-gray-700">${item['解説']}</div>
                </div>
            `;

            // マーカーを追加
            L.marker([lat, lon], { icon: selectedIcon })
                .addTo(map)
                .bindPopup(popupContent);
        });
