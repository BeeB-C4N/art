<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金沢市坂道クイズ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet.js (地図) を削除 -->
     
    <!-- Google Fonts (ポップなフォント) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #2d261e;
        }

        .card-bg {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #333;
        }

        /* 地図コンテナのスタイルを削除 */

        .btn-action {
            @apply w-full font-bold py-4 px-12 rounded-full text-lg shadow-xl transition-transform transform hover:scale-105;
            background-image: linear-gradient(to right, #f97316, #ea580c);
            color: white;
        }
        .btn-action:hover {
            background-image: linear-gradient(to right, #fb923c, #f97316);
        }

        .btn-choice {
            @apply w-full font-bold py-4 px-6 rounded-lg text-lg shadow-md transition-all transform hover:scale-105 hover:opacity-90;
            color: white;
        }
        .bg-choice-a {
            background-image: linear-gradient(to right, #2563eb, #3b82f6);
        }
        .bg-choice-b {
            background-image: linear-gradient(to right, #ec4899, #f472b6);
        }
        .bg-choice-c {
            background-image: linear-gradient(to right, #8b5cf6, #a78bfa);
        }

        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        @keyframes bounce-in {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); }
        }
        .animate-bounce-in {
            animation: bounce-in 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) both;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl mx-auto">
        
        <!-- 1. スタート画面 -->
        <div id="start-screen" class="text-center p-8 card-bg rounded-2xl shadow-2xl w-full">
            <h1 class="text-4xl md:text-5xl font-extrabold gradient-text bg-gradient-to-r from-yellow-600 to-orange-600 mb-4">金沢市 坂道クイズ</h1>
            <p class="text-gray-600 mb-8 text-lg">金沢の風情ある坂道に、あなたはどれだけ詳しい？</p>
            <button id="start-button" class="btn-action text-2xl">
                挑戦する
            </button>
        </div>

        <!-- 2. クイズ画面 -->
        <div id="quiz-screen" class="hidden p-6 card-bg rounded-2xl shadow-2xl w-full">
            <h3 id="question-number" class="text-3xl font-extrabold text-center mb-4 gradient-text bg-gradient-to-r from-blue-600 to-cyan-400"></h3>
            <p class="text-xl mb-4 font-bold text-gray-700">以下の坂の説明は、どの坂？</p>
            
            <blockquote id="question-text" class="text-lg p-4 mb-6 bg-gray-100 border-l-4 border-orange-500 italic leading-relaxed text-gray-600">
                <!-- 坂の説明がここに入る -->
            </blockquote>

            <div id="options-container" class="grid grid-cols-1 gap-4">
                <!-- 選択肢ボタンがここに入る -->
            </div>
        </div>

        <!-- 3. 正解発表画面 -->
        <div id="answer-screen" class="hidden p-6 card-bg rounded-2xl shadow-2xl w-full">
            <h3 id="result-title" class="text-3xl font-bold mb-4 text-center"></h3>
            <p id="correct-answer-text" class="text-xl mb-4 text-center font-semibold"></p>

            <!-- ★ 修正点: 地図を削除し、緯度経度表示用の <p> を追加 -->
            <div class="p-4 bg-gray-100 rounded-lg mb-6 text-center">
                <p class="text-lg font-semibold text-gray-700">場所のヒント（緯度/経度）</p>
                <p id="answer-coords" class="text-base text-gray-600"></p>
            </div>
            
            <button id="next-button" class="btn-action text-xl">
                次の問題へ
            </button>
        </div>

        <!-- 4. 最終結果画面 -->
        <div id="end-screen" class="hidden text-center p-8 card-bg rounded-2xl shadow-2xl w-full">
            <h2 class="text-3xl font-bold mb-4 gradient-text bg-gradient-to-r from-orange-500 to-rose-500">お疲れ様でした！</h2>
            <p class="text-5xl font-extrabold my-6" id="score-text"></p>
            <p class="text-lg mb-8 text-gray-600">あなたも立派な金沢坂道博士です。</p>
            <button id="restart-button" class="btn-action text-2xl">
                もう一度挑戦
            </button>
        </div>

    </div>

    <!-- 正解・不正解フィードバックモーダル (珠洲クイズ風) -->
    <div id="feedback-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-70 flex items-center justify-center z-50 p-4">
        <div id="feedback-modal-content" class="text-7xl sm:text-9xl font-extrabold text-white" style="text-shadow: 0 0 20px rgba(0,0,0,0.5);">
            <!-- JSで内容をセット -->
        </div>
    </div>

    <script>
        // 坂道データ
        const SLOPE_DATA = [
            { lat: 36.546198, lon: 136.660107, name: "不老坂（ふろうさか）", desc: "細く急な坂道であったが、明治の中ごろ上菊橋とつながり、のち拡張整備され縁起の良いこの名がつけられたという。近くに風呂屋があり、不老長寿によいというので、この名で呼ばれたともいう。" },
            { lat: 36.54879, lon: 136.659238, name: "長良坂（ながらざか）", desc: "旧長良町へ上がるのでこの名がついた。犀川のがけふちにあり、川風が吹き上げてくるので、吹上とも呼ばれていた。" },
            { lat: 36.553027, lon: 136.654909, name: "桜坂（さくらざか）", desc: "慶応元年に作られ、明治25年改修された。城からの眺めをよくするため、加賀藩時代、坂の上に桜が多く植えられたのでこの名で呼ばれた。" },
            { lat: 36.553027, lon: 136.654909, name: "石伐坂（いしきりざか）", desc: "藩政時代から坂の上に職人町があった。清立寺坂、吹屋坂、くの字坂とも呼ばれ、現在はＷ坂という。" },
            { lat: 36.557663, lon: 136.650426, name: "蛤坂（はまぐりざか）", desc: "加賀藩前期に妙慶寺坂といったが、享保18年の火災後、蛤が口を開いたようになったのでこの名がついた。" },
            { lat: 36.542572, lon: 136.668224, name: "御参詣坂（ごさんけいざか）", desc: "藩政時代、法島村から祇陀寺の向こうへ至る坂と、今一つ崖の下から桃雲寺手前の野田往来へ至る坂をこう呼んだ。野田山墓地に参詣することからこの名がついた。" },
            { lat: 36.547829, lon: 136.677071, name: "善光寺坂（ぜんこうじざか）", desc: "昔この付近に善光寺という寺があったのでこの名で呼ばれている。" },
            { lat: 36.551611, lon: 136.673501, name: "亀坂（がめざか）", desc: "加賀藩初期、この付近は深い谷であったが、戸室石をはこぶため埋めて次第に坂の勾配をゆるくした。がめ坂の名の由来は明らかでない。" },
            { lat: 36.555086, lon: 136.667039, name: "新坂（しんさか）", desc: "加賀藩前期、嫁坂のあとにできたのでこの名がついた。昔は、小立野新坂、笠舞新坂ともよばれた。" },
            { lat: 36.554721, lon: 136.678798, name: "鶴間坂（つるまざか）", desc: "坂の上からの眺望がよく、加賀藩時代から詩歌を好む人が訪れ、ここを鶴舞谷と称していたのでこの名がついた。" },
            { lat: 36.555889, lon: 136.666236, name: "嫁坂（よめざか）", desc: "加賀藩初期、坂の上に住んでいた藩の重臣、篠原出羽守が、娘を本庄主馬へ嫁がせる時つけた坂なのでこの名がついた。" },
            { lat: 36.557345, lon: 136.662815, name: "大乗寺坂（だいじょうじざか）", desc: "慶長から元禄年間に曹洞宗の古寺、大乗寺が坂下にあったのでこの名で呼ばれている。同寺はのち長坂へ移転した。" },
            { lat: 36.558544, lon: 136.674891, name: "天神坂（てんじんざか）", desc: "椿原神社の旧社名、田井天神の横にあるのでこの名で呼ばれている。昔、坂の上部は三つに分かれていた。" },
            { lat: 36.559696, lon: 136.668676, name: "木曽坂（きそざか）", desc: "木曽の山中のような幽すいな所なのでこの名がついた。その一部は宝円寺の裏門の坂なので裏門坂ともいわれていた。" },
            { lat: 36.559541, lon: 136.671012, name: "馬坂（うまざか）", desc: "昔、田井村の農民が小立野へ草刈りに行くため、馬をひいて登ったのでこの名がついた。六曲り坂ともいわれていた。" },
            { lat: 36.561452, lon: 136.665451, name: "八坂（はっさか）", desc: "昔、付近に木こりが通う八つの坂があったのでこの名がついた。のち、一つが残り、宝憧寺坂、伊予殿坂とも呼ばれた。" },
            { lat: 36.56157, lon: 136.660529, name: "広坂（ひろさか）", desc: "坂道の幅が広いのでこの名で呼ばれているが、加賀藩時代から明治中期頃までは安房殿坂、作事坂ともいわれていた。" },
            { lat: 36.562299, lon: 136.664941, name: "小尻谷坂（こじりたにざか）", desc: "藩政期の中ごろ尻谷坂（汁谷坂・尻垂坂等）より小さいところから、この名がついたといわれている。" },
            { lat: 36.564948, lon: 136.662317, name: "紺屋坂（こんやざか）", desc: "加賀藩初期に藩の御用染商、館紺屋孫十郎が坂の付近に住んでいたので、この名がついた。" },
            { lat: 36.568674, lon: 136.656825, name: "甚右衛門坂（じんえもんざか）", desc: "天正八年佐久間盛政の攻撃をうけたとき、本願寺方の浪士、平野甚右衛門が奮戦、討死した坂なのでこの名がついた。" },
            { lat: 36.541829, lon: 136.684612, name: "大瀧坂（おおたきざか）", desc: "かつてこの坂の脇には、辰巳用水から台地下の田畑を潤す流れが、大きな滝のように流れ落ちていたことから、この名がついた。" },
            { lat: 36.569515, lon: 136.670004, name: "帰厚坂（きこうざか）", desc: "加賀藩主、前田慶寧が慶応3年卯辰山を開拓したときの坂で、「藩主の厚き徳に帰する」の意味から名づけられた。" },
            { lat: 36.5709817, lon: 136.6690627, name: "観音坂（かんのんざか）", desc: "観音院の門前の坂で、加賀藩初期、同院の参道として作られた。明治42年北側に新しい坂路ができた。" },
            { lat: 36.57281, lon: 136.668472, name: "子来坂（こぎざか）", desc: "慶応3年卯辰山が開拓された時、作業に出た住民多数が子供が来るようににぎやかに登ったのでこの名がついた。今はこらい坂と呼んでいる。" },
            { lat: 36.572111, lon: 136.663414, name: "暗がり坂（くらがりざか）", desc: "久保市乙剣宮より主計町に通じる小路を指し、日中も日の当たらない暗い坂道なので、この名で呼ばれている。暗闇坂ともいう。" }
        ];

        // 状態（State）
        let currentQuestionIndex = 0;
        let score = 0;
        let quizQuestions = []; // 10問のクイズデータを格納
        // ★ 修正点: map と currentMarker を削除
        const TOTAL_QUESTIONS = 10;
        
        // DOM要素
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const answerScreen = document.getElementById('answer-screen');
        const endScreen = document.getElementById('end-screen');
        
        const startButton = document.getElementById('start-button');
        const nextButton = document.getElementById('next-button');
        const restartButton = document.getElementById('restart-button');
        
        const questionNumber = document.getElementById('question-number');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        
        const resultTitle = document.getElementById('result-title');
        const correctAnswerText = document.getElementById('correct-answer-text');
        const scoreText = document.getElementById('score-text');
        
        // ★ 修正点: 緯度経度表示用の要素を取得
        const answerCoords = document.getElementById('answer-coords');

        // アニメーション用モーダル
        const feedbackModal = document.getElementById('feedback-modal');
        const feedbackModalContent = document.getElementById('feedback-modal-content');
        
        // 選択肢ボタンの色
        const choiceColors = ['bg-choice-a', 'bg-choice-b', 'bg-choice-c'];

        // --- ユーティリティ関数 ---

        /** 配列をシャッフル (Fisher-Yates) */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- 地図関連（削除） ---
        // ★ 修正点: initMap と zoomToLocation 関数を削除

        // --- クイズロジック ---

        /** 10問のクイズデータを生成 */
        function generateQuizQuestions() {
            const allSlopeNames = SLOPE_DATA.map(s => s.name);
            const shuffledData = shuffleArray([...SLOPE_DATA]);
            
            quizQuestions = shuffledData.slice(0, TOTAL_QUESTIONS).map(correctSlope => {
                const otherNames = allSlopeNames.filter(name => name !== correctSlope.name);
                const shuffledOtherNames = shuffleArray(otherNames);
                
                const options = [
                    shuffledOtherNames[0],
                    shuffledOtherNames[1],
                    correctSlope.name
                ];
                
                return {
                    correct: correctSlope,
                    options: shuffleArray(options)
                };
            });
        }

        /** クイズ画面の表示 */
        function displayQuestion() {
            if (currentQuestionIndex >= TOTAL_QUESTIONS) {
                showEndScreen();
                return;
            }

            // ★ 修正点: 地図関連のロジックを削除
            const q = quizQuestions[currentQuestionIndex];
            
            questionNumber.textContent = `第 ${currentQuestionIndex + 1} 問`;
            questionText.textContent = q.correct.desc;
            
            optionsContainer.innerHTML = '';
            q.options.forEach((optionName, index) => {
                const button = document.createElement('button');
                button.textContent = optionName;
                button.className = `btn-choice ${choiceColors[index % choiceColors.length]}`;
                button.onclick = () => checkAnswer(optionName, button);
                optionsContainer.appendChild(button);
            });

            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            answerScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
        }

        /** 解答のチェック */
        function checkAnswer(selectedName, clickedButton) {
            const buttons = optionsContainer.querySelectorAll('.btn-choice');
            buttons.forEach(btn => btn.disabled = true);
            
            const q = quizQuestions[currentQuestionIndex];
            const isCorrect = (selectedName === q.correct.name);

            if (isCorrect) {
                score++;
                resultTitle.textContent = "正解！";
                resultTitle.className = "text-3xl font-bold mb-4 text-center text-orange-500";
            } else {
                resultTitle.textContent = "不正解…";
                resultTitle.className = "text-3xl font-bold mb-4 text-center text-blue-600";
            }
            
            showResultAnimation(isCorrect);

            buttons.forEach(btn => {
                if (btn.textContent === q.correct.name) {
                    btn.style.backgroundImage = 'linear-gradient(to right, #22c55e, #16a34a)'; // 緑
                } else if (btn === clickedButton) {
                    btn.style.backgroundImage = 'linear-gradient(to right, #ef4444, #dc2626)'; // 赤
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            setTimeout(() => {
                feedbackModal.classList.add('hidden');
                feedbackModalContent.classList.remove('animate-bounce-in');

                correctAnswerText.textContent = `正解は「${q.correct.name}」でした。`;
                
                // ★ 修正点: 緯度と経度をテキストで表示
                answerCoords.textContent = `緯度: ${q.correct.lat} / 経度: ${q.correct.lon}`;
                
                quizScreen.classList.add('hidden');
                answerScreen.classList.remove('hidden');

                // ★ 修正点: zoomToLocation の呼び出しを削除

            }, 1500);
        }

        /** ポップなアニメーションの表示 (珠洲クイズ風) */
        function showResultAnimation(isCorrect) {
            if (isCorrect) {
                feedbackModalContent.textContent = '正解！';
                feedbackModalContent.style.backgroundImage = 'linear-gradient(to right, #fde047, #f97316)';
            } else {
                feedbackModalContent.textContent = 'はずれ！';
                feedbackModalContent.style.backgroundImage = 'linear-gradient(to right, #7dd3fc, #3b82f6)';
            }
            feedbackModalContent.classList.add('gradient-text');
            feedbackModal.classList.remove('hidden');
            feedbackModalContent.classList.add('animate-bounce-in');
        }

        /** 次の問題へ */
        function nextQuestion() {
            currentQuestionIndex++;
            displayQuestion();
        }

        /** 最終結果画面の表示 */
        function showEndScreen() {
            scoreText.textContent = `${TOTAL_QUESTIONS}問中 ${score}問 正解`;
            answerScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
        }

        /** クイズの開始 */
        function startGame() {
            currentQuestionIndex = 0;
            score = 0;
            generateQuizQuestions();
            displayQuestion();
            feedbackModal.classList.add('hidden');
            feedbackModalContent.classList.remove('animate-bounce-in');
        }

        // --- イベントリスナー ---
        // ★ 修正点: DOMContentLoaded から initMap を削除
        document.addEventListener('DOMContentLoaded', () => {
            // 今後もし初期化処理が必要ならここに追加
        });

        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);
        nextButton.addEventListener('click', nextQuestion);

    </script>
</body>
</html>
