<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f59d1a" />
  <title>rule1 — origin</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3a01c;
    }
    body {
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
    }
    .veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.06), rgba(255,255,255,0) 42%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.03));
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <canvas id="art" aria-label="rule1 animated abstract artwork"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('art');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const TAU = Math.PI * 2;

      const P = {
        orange: '#f59d1a',
        orange2: '#ff6e2c',
        yellow: '#ffe533',
        green: '#59ef3f',
        green2: '#118d10',
        blue: '#2246ff',
        sky: '#76c3ff',
        purple: '#6a178f',
        magenta: '#d655ff',
        black: '#0b0b0f',
        white: '#ffffff'
      };

      let W = 0, H = 0, DPR = 1;
      let time = 0;
      let last = performance.now();
      let resizeTimer = 0;
      let seed = Math.floor(Math.random() * 1e9);

      let blocks = [];
      let dots = [];
      let tinyDots = [];
      let gridV = [];
      let gridH = [];
      let blades = [];
      let whiteCuts = [];
      let paper = null;

      function mulberry32(a) {
        return function() {
          let t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      const rr = (rng, min, max) => min + (max - min) * rng();
      const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
      const wrap = (v, max) => ((v % max) + max) % max;

      function makePaper(size) {
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const g = c.getContext('2d');
        const rng = mulberry32(seed + 77);

        const bg = g.createLinearGradient(0, 0, size, size);
        bg.addColorStop(0, '#f7ab1d');
        bg.addColorStop(0.3, '#ef8c11');
        bg.addColorStop(0.68, '#f0b51d');
        bg.addColorStop(1, '#ffc724');
        g.fillStyle = bg;
        g.fillRect(0, 0, size, size);

        for (let i = 0; i < size * size * 0.035; i++) {
          g.globalAlpha = rr(rng, 0.04, 0.2);
          g.fillStyle = pick(rng, ['#ffd469', '#ff861a', '#ff5f1f', '#ffe34e', '#d47d09']);
          g.beginPath();
          g.arc(rr(rng, 0, size), rr(rng, 0, size), rr(rng, 0.5, 1.8), 0, TAU);
          g.fill();
        }
        for (let i = 0; i < 240; i++) {
          g.globalAlpha = rr(rng, 0.05, 0.16);
          g.strokeStyle = pick(rng, ['#ffffff', '#ffef6f', '#ff7e28']);
          g.lineWidth = rr(rng, 0.7, 2.3);
          const x = rr(rng, -size * 0.1, size * 1.1);
          const y = rr(rng, -size * 0.1, size * 1.1);
          g.beginPath();
          g.moveTo(x, y);
          g.lineTo(x + rr(rng, -180, 180), y + rr(rng, -180, 180));
          g.stroke();
        }
        g.globalAlpha = 1;
        return c;
      }

      function buildScene() {
        const rng = mulberry32(seed);
        blocks = [];
        dots = [];
        tinyDots = [];
        gridV = [];
        gridH = [];
        blades = [];
        whiteCuts = [];

        const base = Math.min(W, H);

        // Foundational color masses inspired by the source image.
        blocks.push(
          { x: W * 0.17, y: H * 0.74, w: W * 0.24, h: H * 0.34, color: P.green, alpha: 0.84, driftX: 2, driftY: -3, phase: 0.2, blur: 0.15 },
          { x: W * 0.30, y: H * 0.56, w: W * 0.38, h: H * 0.63, color: P.black, alpha: 0.82, driftX: -1, driftY: 2, phase: 1.5, blur: 0.08 },
          { x: W * 0.53, y: H * 0.30, w: W * 0.62, h: H * 0.26, color: P.purple, alpha: 0.76, driftX: 2, driftY: 1, phase: 2.1, blur: 0.09 },
          { x: W * 0.71, y: H * 0.83, w: W * 0.52, h: H * 0.27, color: P.sky, alpha: 0.78, driftX: -2, driftY: 0.5, phase: 3.7, blur: 0.1 },
          { x: W * 0.62, y: H * 0.79, w: W * 0.29, h: H * 0.28, color: P.black, alpha: 0.78, driftX: 1.5, driftY: -0.8, phase: 4.6, blur: 0.06 },
          { x: W * 0.06, y: H * 0.28, w: W * 0.11, h: H * 0.24, color: P.black, alpha: 0.74, driftX: 0.8, driftY: 1.6, phase: 5.4, blur: 0.14 },
          { x: W * 0.09, y: H * 0.60, w: W * 0.17, h: H * 0.18, color: P.purple, alpha: 0.66, driftX: 1.8, driftY: -1.3, phase: 1.1, blur: 0.1 },
          { x: W * 0.49, y: H * 0.11, w: W * 0.72, h: H * 0.2, color: P.orange2, alpha: 0.28, driftX: -1.4, driftY: 0.6, phase: 0.9, blur: 0.2 }
        );

        // Grid: the 'rule' itself.
        const vCount = 16;
        for (let i = 0; i < vCount; i++) {
          const x = (i / (vCount - 1)) * W + rr(rng, -20, 20);
          gridV.push({
            x,
            width: i % 5 === 0 ? rr(rng, 2.4, 5.2) : rr(rng, 0.8, 2.2),
            color: i % 4 === 0 ? P.white : (i % 3 === 0 ? P.purple : P.black),
            alpha: i % 4 === 0 ? rr(rng, 0.58, 0.92) : rr(rng, 0.24, 0.66),
            phase: rr(rng, 0, TAU),
            drift: rr(rng, -6, 6)
          });
        }
        const hCount = 15;
        for (let i = 0; i < hCount; i++) {
          const y = (i / (hCount - 1)) * H + rr(rng, -18, 18);
          gridH.push({
            y,
            width: i % 4 === 0 ? rr(rng, 2.4, 4.4) : rr(rng, 0.8, 2.2),
            color: i % 5 === 0 ? P.white : (i % 2 === 0 ? P.black : P.purple),
            alpha: i % 5 === 0 ? rr(rng, 0.54, 0.88) : rr(rng, 0.22, 0.58),
            phase: rr(rng, 0, TAU),
            drift: rr(rng, -6, 6)
          });
        }

        // Dark horizontal streaks / blades.
        const bladeCount = 26;
        for (let i = 0; i < bladeCount; i++) {
          blades.push({
            x: rr(rng, -W * 0.1, W * 0.92),
            y: rr(rng, 0, H),
            len: rr(rng, W * 0.08, W * 0.28),
            thickness: rr(rng, 3, 12),
            color: i % 3 === 0 ? P.green2 : P.black,
            alpha: i % 3 === 0 ? rr(rng, 0.38, 0.78) : rr(rng, 0.46, 0.84),
            driftX: rr(rng, -9, 9),
            phase: rr(rng, 0, TAU)
          });
        }

        // White cuts / linear accents.
        const cutCount = 44;
        for (let i = 0; i < cutCount; i++) {
          whiteCuts.push({
            x: rr(rng, 0, W),
            y: rr(rng, 0, H),
            len: rr(rng, base * 0.03, base * 0.16),
            angle: rr(rng, -1.2, 1.2),
            width: rr(rng, 1.2, 4.0),
            alpha: rr(rng, 0.32, 0.88),
            color: i % 7 === 0 ? P.sky : P.white,
            driftX: rr(rng, -7, 7),
            driftY: rr(rng, -7, 7),
            phase: rr(rng, 0, TAU)
          });
        }

        // Main colored circles.
        const palette = [P.green, P.yellow, P.blue, P.magenta, P.white, P.orange, P.purple];
        const dotCount = Math.max(220, Math.round((W * H) / 5200));
        for (let i = 0; i < dotCount; i++) {
          dots.push({
            x: rr(rng, 0, W),
            y: rr(rng, 0, H),
            r: rr(rng, 4, 22),
            color: pick(rng, palette),
            alpha: rr(rng, 0.6, 0.96),
            driftX: rr(rng, -10, 10),
            driftY: rr(rng, -10, 10),
            orbit: rr(rng, 0, 8),
            speed: rr(rng, 0.22, 1.1),
            phase: rr(rng, 0, TAU)
          });
        }

        // Fine dust.
        const tinyCount = Math.max(700, Math.round((W * H) / 1300));
        for (let i = 0; i < tinyCount; i++) {
          tinyDots.push({
            x: rr(rng, 0, W),
            y: rr(rng, 0, H),
            r: rr(rng, 0.6, 2.3),
            color: pick(rng, [P.white, P.yellow, P.orange, P.magenta, P.green, P.blue, P.black]),
            alpha: rr(rng, 0.12, 0.55),
            driftX: rr(rng, -5, 5),
            driftY: rr(rng, -5, 5),
            phase: rr(rng, 0, TAU)
          });
        }

        const texSize = Math.max(700, Math.min(1200, Math.round(Math.max(W, H) * 0.92)));
        paper = makePaper(texSize);
      }

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 1.75);
        W = Math.max(1, window.innerWidth);
        H = Math.max(1, window.innerHeight);
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.imageSmoothingEnabled = true;
        buildScene();
      }

      function drawPaper(t) {
        ctx.fillStyle = P.orange;
        ctx.fillRect(0, 0, W, H);

        const tw = paper.width;
        const th = paper.height;
        const ox = wrap(t * 7.5, tw);
        const oy = wrap(-t * 5.2, th);
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 0.62;
        for (let y = -th + oy; y < H + th; y += th) {
          for (let x = -tw + ox; x < W + tw; x += tw) {
            ctx.drawImage(paper, x, y);
          }
        }
        ctx.restore();
      }

      function drawBlocks(t) {
        ctx.save();
        for (const b of blocks) {
          const x = b.x + Math.sin(t * 0.18 + b.phase) * b.driftX;
          const y = b.y + Math.cos(t * 0.15 + b.phase) * b.driftY;
          const pulseW = 1 + Math.sin(t * 0.28 + b.phase) * 0.03;
          const pulseH = 1 + Math.cos(t * 0.24 + b.phase) * 0.04;

          ctx.save();
          ctx.translate(x, y);
          ctx.scale(pulseW, pulseH);
          ctx.globalAlpha = b.alpha;
          ctx.globalCompositeOperation = b.color === P.sky || b.color === P.green ? 'screen' : 'multiply';
          ctx.fillStyle = b.color;

          // layered soft block / smear
          for (let i = 0; i < 22; i++) {
            const jitterX = Math.sin(i * 0.4 + t * 0.3 + b.phase) * (b.w * b.blur * 0.8);
            const jitterY = Math.cos(i * 0.3 + t * 0.2 + b.phase) * (b.h * b.blur * 0.5);
            const ww = b.w * (0.88 + i * 0.006);
            const hh = b.h * (0.88 + i * 0.004);
            const px = -ww / 2 + jitterX;
            const py = -hh / 2 + jitterY;
            ctx.globalAlpha = b.alpha * 0.05;
            ctx.beginPath();
            ctx.roundRect(px, py, ww, hh, Math.min(24, Math.min(ww, hh) * 0.06));
            ctx.fill();
          }
          // crisper core
          ctx.globalAlpha = b.alpha * 0.65;
          ctx.beginPath();
          ctx.roundRect(-b.w * 0.46, -b.h * 0.46, b.w * 0.92, b.h * 0.92, Math.min(28, Math.min(b.w, b.h) * 0.06));
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      function drawGrid(t) {
        ctx.save();
        ctx.lineCap = 'square';
        for (const g of gridV) {
          const x = g.x + Math.sin(t * 0.1 + g.phase) * g.drift;
          ctx.globalCompositeOperation = g.color === P.white ? 'screen' : 'multiply';
          ctx.globalAlpha = g.alpha * (0.78 + 0.22 * Math.sin(t * 0.3 + g.phase));
          ctx.strokeStyle = g.color;
          ctx.lineWidth = g.width;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        for (const g of gridH) {
          const y = g.y + Math.cos(t * 0.1 + g.phase) * g.drift;
          ctx.globalCompositeOperation = g.color === P.white ? 'screen' : 'multiply';
          ctx.globalAlpha = g.alpha * (0.78 + 0.22 * Math.cos(t * 0.28 + g.phase));
          ctx.strokeStyle = g.color;
          ctx.lineWidth = g.width;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawBlades(t) {
        ctx.save();
        for (const b of blades) {
          const x = wrap(b.x + t * b.driftX, W + b.len * 2) - b.len;
          const y = b.y + Math.sin(t * 0.16 + b.phase) * 4;
          const len = b.len * (0.92 + 0.08 * Math.sin(t * 0.25 + b.phase));
          ctx.globalCompositeOperation = b.color === P.green2 ? 'screen' : 'multiply';
          ctx.globalAlpha = b.alpha;
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + len * 0.92, y - b.thickness * 0.48);
          ctx.quadraticCurveTo(x + len, y, x + len * 0.92, y + b.thickness * 0.48);
          ctx.lineTo(x, y + b.thickness * 0.34);
          ctx.quadraticCurveTo(x - b.thickness * 0.3, y, x, y);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawWhiteCuts(t) {
        ctx.save();
        ctx.lineCap = 'round';
        for (const c of whiteCuts) {
          const x = wrap(c.x + t * c.driftX, W + 80) - 40;
          const y = wrap(c.y + t * c.driftY, H + 80) - 40;
          const a = c.angle + Math.sin(t * 0.22 + c.phase) * 0.25;
          ctx.globalCompositeOperation = 'screen';
          ctx.globalAlpha = c.alpha;
          ctx.strokeStyle = c.color;
          ctx.lineWidth = c.width;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + Math.cos(a) * c.len, y + Math.sin(a) * c.len);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawDots(t) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (const d of dots) {
          const x = wrap(d.x + t * d.driftX + Math.cos(t * d.speed + d.phase) * d.orbit, W + 60) - 30;
          const y = wrap(d.y + t * d.driftY + Math.sin(t * d.speed * 1.17 + d.phase) * d.orbit, H + 60) - 30;
          const pulse = 1 + 0.08 * Math.sin(t * 0.9 + d.phase);
          ctx.globalAlpha = d.alpha * (0.7 + 0.3 * Math.sin(t * 0.8 + d.phase) ** 2);
          ctx.fillStyle = d.color;
          ctx.beginPath();
          ctx.arc(x, y, d.r * pulse, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawTinyDots(t) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (const d of tinyDots) {
          const x = wrap(d.x + t * d.driftX + Math.cos(t * 0.35 + d.phase) * 2, W + 20) - 10;
          const y = wrap(d.y + t * d.driftY + Math.sin(t * 0.35 + d.phase) * 2, H + 20) - 10;
          ctx.globalAlpha = d.alpha;
          ctx.fillStyle = d.color;
          ctx.beginPath();
          ctx.arc(x, y, d.r, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function frame(now) {
        const dt = Math.min(40, now - last) / 1000;
        last = now;
        time += dt;

        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';

        drawPaper(time);
        drawBlocks(time);
        drawBlades(time);
        drawDots(time);
        drawTinyDots(time);
        drawWhiteCuts(time);
        drawGrid(time);

        requestAnimationFrame(frame);
      }

      function reseed() {
        seed = Math.floor(Math.random() * 1e9);
        buildScene();
      }

      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 120);
      }, { passive: true });

      let lastTap = 0;
      window.addEventListener('pointerdown', () => {
        const now = performance.now();
        if (now - lastTap < 320) reseed();
        lastTap = now;
      }, { passive: true });

      document.addEventListener('visibilitychange', () => {
        last = performance.now();
      });

      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
